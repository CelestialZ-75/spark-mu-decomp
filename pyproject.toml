[project]
name = "spark-mu-course"
version = "0.1.0"
description = "Environment and distributed execution for the MU course project"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "h5py>=3.10,<4",
    "pyyaml>=6,<7",
    "pyspark==3.5.7",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0"]
gpu = ["torch==2.8.0"]
plots = ["matplotlib>=3.8,<4"]

[project.scripts]
mu-decomp = "mu_course.run_experiment:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mu_course = ["data/*.npz", "data/*.json", "data/*.md", "ckc/*.md"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
